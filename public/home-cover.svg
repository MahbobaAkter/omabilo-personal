<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A winter valley at golden hour: glacier mountains, teal hills and a pine forest in snow">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe9ea"/>
      <stop offset="0.45" stop-color="#f3e6cc"/>
      <stop offset="0.8" stop-color="#ecc98f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.62" r="0.32">
      <stop offset="0" stop-color="#fbe3b0" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#f4cf8e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f4cf8e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d0d9"/>
      <stop offset="1" stop-color="#9dbccb"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9893"/>
      <stop offset="1" stop-color="#3f7a75"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#e3e9e6"/>
    </linearGradient>
    <g id="pine">
      <path d="M0 -60 L13 -34 L7 -34 L19 -12 L10 -12 L24 12 L-24 12 L-10 -12 L-19 -12 L-7 -34 L-13 -34 Z"/>
      <rect x="-3" y="12" width="6" height="8"/>
    </g>
    <g id="flake" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.75">
      <path d="M0 -7 V7 M-6 -3.5 L6 3.5 M-6 3.5 L6 -3.5"/>
    </g>
  </defs>

  <rect width="1600" height="480" fill="url(#sky)"/>
  <rect width="1600" height="480" fill="url(#sun)"/>

  <!-- Glacier range -->
  <path d="M0 300 L120 230 L210 262 L330 170 L430 238 L540 196 L660 250 L780 150 L900 232 L1010 190 L1130 246 L1260 168 L1380 236 L1490 204 L1600 240 V480 H0 Z" fill="url(#far)"/>
  <path d="M330 170 L362 192 L346 190 L330 200 L314 188 L300 194 Z M780 150 L816 176 L798 174 L780 186 L762 172 L746 178 Z M1260 168 L1292 190 L1276 188 L1260 198 L1244 186 L1230 192 Z" fill="#f7f3ea" opacity="0.9"/>

  <!-- Teal hills -->
  <path d="M0 330 C180 280 300 300 440 318 C600 338 720 286 900 296 C1060 305 1180 340 1340 316 C1450 300 1530 296 1600 306 V480 H0 Z" fill="url(#mid)"/>

  <!-- Pine forest -->
  <g fill="#24493d">
    <use href="#pine" transform="translate(60 352) scale(1.1)"/>
    <use href="#pine" transform="translate(110 362) scale(0.9)"/>
    <use href="#pine" transform="translate(160 350) scale(1.25)"/>
    <use href="#pine" transform="translate(225 366) scale(0.85)"/>
    <use href="#pine" transform="translate(470 360) scale(1)"/>
    <use href="#pine" transform="translate(515 368) scale(0.8)"/>
    <use href="#pine" transform="translate(1080 358) scale(1.05)"/>
    <use href="#pine" transform="translate(1130 366) scale(0.85)"/>
    <use href="#pine" transform="translate(1180 352) scale(1.2)"/>
    <use href="#pine" transform="translate(1390 360) scale(0.95)"/>
    <use href="#pine" transform="translate(1440 350) scale(1.3)"/>
    <use href="#pine" transform="translate(1500 364) scale(0.9)"/>
    <use href="#pine" transform="translate(1550 356) scale(1.1)"/>
  </g>

  <!-- Snowfield and the dark forest edge the text sits on -->
  <path d="M0 384 C260 366 520 392 800 380 C1080 368 1340 392 1600 378 V480 H0 Z" fill="url(#snow)"/>
  <path d="M0 418 C240 404 520 426 800 414 C1080 402 1360 424 1600 410 V480 H0 Z" fill="#1d3a31"/>
  <g fill="#173029">
    <use href="#pine" transform="translate(20 430) scale(1.5)"/>
    <use href="#pine" transform="translate(300 436) scale(1.3)"/>
    <use href="#pine" transform="translate(760 426) scale(1.4)"/>
    <use href="#pine" transform="translate(1250 432) scale(1.35)"/>
    <use href="#pine" transform="translate(1585 424) scale(1.55)"/>
  </g>

  <!-- A few snowflakes -->
  <use href="#flake" transform="translate(140 80)"/>
  <use href="#flake" transform="translate(420 54) scale(0.8)"/>
  <use href="#flake" transform="translate(620 112) scale(0.7)"/>
  <use href="#flake" transform="translate(980 70)"/>
  <use href="#flake" transform="translate(1340 96) scale(0.85)"/>
  <use href="#flake" transform="translate(1520 48) scale(0.7)"/>
</svg>
